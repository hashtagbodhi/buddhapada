<style>

.ev-pick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; } .ev-pick::-webkit-scrollbar { display: none; } .ev-pick button { flex: none; height: 30px; padding: 0 12px; border-radius: 99px; font-size: 12px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink2); background: rgba(255, 255, 255, .6); } .ev-pick button[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }

      (L.shot && L.idDoc && st !== "conf" ? '<select id="a-room" aria-label="Room number" style="height:28px;border-radius:99px;border:1px solid var(--line);padding:0 8px">' + free.map(function (r) { return "<option>" + r + "</option>"; }).join("") + '</select><button class="btn sm" data-a="confirm"' + (free.length ? "" : " disabled") + ">Confirm and allot</button>" : "") +
      (st !== "wait" && st !== "conf" && st !== "lost" ? '<button class="btn sm ghost" data-a="wait">Waiting list</button>' : "") + (st !== "lost" ? '<button class="btn sm warn" data-a="lost">Cancel</button>' : '<button class="btn sm ghost" data-a="reopen">Reopen</button>') + "</div></div>" +
      '<div class="sec"><h4>Request</h4><dl class="kv"><dt>Programme</dt><dd>' + esc(e.name) + "</dd><dt>Dates</dt><dd>" + range(e) + " · " + nights(e) + " nights</dd><dt>Guests</dt><dd>" + L.guests + '</dd><dt>Room</dt><dd><select id="a-type" aria-label="Room category" style="border:0;background:none;font-weight:500;text-align:right">' + TYPES.map(function (x) { return '<option value="' + x.id + '"' + (x.id === L.type ? " selected" : "") + ">" + x.name + "</option>"; }).join("") + "</select></dd><dt>Stay</dt><dd>" + inr(m.total) + "</dd><dt>Advance (50%)</dt><dd>" + inr(m.adv) + "</dd><dt>Balance</dt><dd>" + inr(m.bal) + "</dd><dt>Been here before</dt><dd>" + (L.before ? "Yes" : "First time") + "</dd><dt>Received</dt><dd>" + when(L.created) + "</dd></dl></div>" +
      '<div class="sec"><h4>Free for ' + esc(e.name) + '</h4><div class="avail">' + TYPES.map(function (x) { var uu = usage(L.ev, x.id); return '<div class="' + (uu.free ? "" : "zero") + '"><span>' + x.name + " · " + inr(x.rate) + "</span><b>" + (uu.free ? uu.free + " of " + uu.total : "Full") + "</b></div>"; }).join("") + "</div></div>" +
      '<div class="sec"><h4>Documents</h4><dl class="kv"><dt>Payment screenshot</dt><dd>' + (L.shot ? "Received" : "—") + "</dd><dt>ID</dt><dd>" + (L.idDoc || "—") + '</dd></dl><p style="margin:10px 0 0;font-size:11.500px;color:var(--ink3)">In the working system the files themselves are stored securely and only the last four digits are shown here.</p></div></div></div>';
    box.innerHTML = h; box.scrollTop = 0;
    $("d-back").onclick = function () { ui.lead = 0; render(); };
    var subj = $("c-subj"), body = $("c-body");
    function warn() { var w = $("c-warn"), id = $("c-tpl").value; w.innerHTML = id === "first" && short ? '<p class="alert">This template promises a ' + t.name.toLowerCase() + ", but that category is full. Use “First reply · that room is full”.</p>" : /\[Payment details go here\]/.test(body.value) ? '<p class="alert warn">Add your payment details before sending.</p>' : ""; }
    $("c-tpl").onchange = function () { var x = S.tpl.filter(function (q) { return q.id === $("c-tpl").value; })[0]; if (x) { subj.value = fill(x.subj, L); body.value = fill(x.body, L); } warn(); };
    body.oninput = warn;
    if (st === "new") { $("c-tpl").value = short ? "soldout" : "first"; $("c-tpl").onchange(); }
    $("c-in").onchange = function () { ui.inbound = this.checked; $("c-send").textContent = ui.inbound ? "Add their reply" : "Send reply"; };
    $("c-send").onclick = function () {
      if (!body.value.trim()) { toast("Write a message first."); body.focus(); return; }
      var inbound = $("c-in").checked; L.thread.push({ dir: inbound ? "in" : "out", at: Date.now(), subj: subj.value.trim() || (inbound ? "Re: " : "") + (last(L).subj || e.name), body: body.value.trim() });
      if (!inbound) { if (L.stage === "new") L.stage = "talk"; var fu = +$("c-fu").value; L.follow = fu ? Date.now() + fu * DAY : 0; toast("Added to the conversation. In this prototype no email is actually sent."); } else { L.follow = Date.now(); toast("Their reply is logged. It is your turn to answer."); }
      NOW = Date.now(); ui.inbound = false; save(); render();
    };
    $("a-type").onchange = function () { L.type = this.value; L.roomNo = ""; if (L.stage === "hold" || L.stage === "paid") { var uu = usage(L.ev, L.type, L); if (uu.free < need(L)) { L.stage = "talk"; L.holdUntil = 0; toast("That category is full, so the hold was released."); } } save(); render(); };
    box.querySelectorAll("[data-a]").forEach(function (b) { b.onclick = function () {
      var a = b.dataset.a;
      if (a === "hold") { L.stage = "hold"; L.holdUntil = Date.now() + 2 * DAY; L.follow = L.holdUntil - 12 * 36e5; toast("Room held for 48 hours. Send the advance request next."); }
      else if (a === "release") { L.stage = "talk"; L.holdUntil = 0; toast("Hold released. The room is free again."); }
      else if (a === "shot") { L.shot = true; L.stage = "paid"; L.follow = Date.now() + 2 * DAY; toast("Advance recorded. Ask for the ID next."); }
      else if (a === "id") { L.idDoc = "Aadhaar ···· " + String(1000 + Math.floor(Math.random() * 8999)); toast("ID recorded. You can confirm and allot a room."); }
      else if (a === "confirm") { L.roomNo = $("a-room").value; L.stage = "conf"; L.follow = 0; toast("Confirmed in room " + L.roomNo + ". Send the confirmation email."); }
      else if (a === "wait") { L.stage = "wait"; L.holdUntil = 0; L.roomNo = ""; toast("Moved to the waiting list."); }
      else if (a === "lost") { L.stage = "lost"; L.holdUntil = 0; L.roomNo = ""; L.follow = 0; toast("Cancelled. Any room is free again."); }
      else if (a === "reopen") { L.stage = "talk"; toast("Reopened."); }
      NOW = Date.now(); save(); render();
      if (a === "hold" || a === "shot" || a === "confirm") { var pick = { hold: "advance", shot: "idreq", confirm: "confirm" }[a]; if ($("c-tpl")) { $("c-tpl").value = pick; $("c-tpl").onchange(); } }
    }; });
  }
  function cats() { var c = []; S.tpl.forEach(function (x) { if (c.indexOf(x.cat) < 0) c.push(x.cat); }); return c; }

  /* ---------- pipeline ---------- */
  function vBoard() {
    var all = visible();
    $("view").innerHTML = '<div class="board">' + STAGES.map(function (s) { var ls = all.filter(function (L) { return L.stage === s[0]; }).sort(function (a, b) { return last(b).at - last(a).at; }); return '<div class="col"><h3>' + s[1] + "<small>" + ls.length + '</small></h3><div class="col-b">' + (ls.map(function (L) { return '<button class="kard" data-lead="' + L.id + '"><b>' + esc(L.name) + "</b><small>" + type(L.type).name + (L.roomNo ? " · room " + L.roomNo : "") + " · " + inr(money(L).total) + (L.stage === "hold" ? " · " + (holding(L) ? "held to " + when(L.holdUntil) : "hold lapsed") : "") + '</small><span class="tag">' + esc(ev(L.ev).name) + "</span></button>"; }).join("") || '<small style="color:var(--ink3);padding:6px">Nobody here.</small>') + "</div></div>"; }).join("") + "</div>";
    document.querySelectorAll("[data-lead]").forEach(function (b) { b.onclick = function () { ui.lead = +b.dataset.lead; ui.view = "leads"; ui.stage = "all"; render(); }; });
  }

  /* ---------- rooms ---------- */
  function vRooms() {
    var e = ev(ui.roomEv);
    $("view").innerHTML = '<div class="ev-pick">' + EVENTS.map(function (x) { return '<button data-rev="' + x.id + '" aria-pressed="' + (x.id === ui.roomEv) + '">' + esc(x.name) + "</button>"; }).join("") + '</div><p style="margin:0 0 14px;color:var(--ink2)">' + esc(e.name) + " · " + range(e) + " · " + nights(e) + ' nights. A held room counts as taken until its 48 hours run out.</p><div class="rooms-grid">' + TYPES.map(function (t) {
      var u = usage(e.id, t.id), pct = function (n) { return (n / u.total * 100).toFixed(1) + "%"; }, who = S.leads.filter(function (L) { return L.ev === e.id && L.type === t.id && (L.stage === "conf" || L.stage === "paid" || holding(L)); });
      return '<div class="rm"><h3>' + t.name + "<small>" + inr(t.rate) + " a night · " + (u.free ? u.free + " free" : "full") + '</small></h3><div class="bar" role="img" aria-label="' + u.conf + " confirmed, " + u.paid + " advance paid, " + u.hold + " held, " + u.free + ' free"><i class="c" style="width:' + pct(u.conf) + '"></i><i class="p" style="width:' + pct(u.paid) + '"></i><i class="h" style="width:' + pct(u.hold) + '"></i></div><div class="legend"><span style="--k:var(--ok)">' + u.conf + ' confirmed</span><span style="--k:var(--gold)">' + u.paid + ' advance paid</span><span style="--k:#e3c383">' + u.hold + " held</span><span>" + u.free + ' free</span></div><div class="cells">' + t.rooms.map(function (n) { var o = S.leads.filter(function (L) { return L.ev === e.id && L.roomNo === n; })[0]; return o ? '<button class="cell c" data-lead="' + o.id + '" title="' + esc(o.name) + '">' + n + "</button>" : '<span class="cell">' + n + "</span>"; }).join("") + '</div><ul class="occ">' + (who.map(function (L) { return "<li>" + esc(L.name) + "<span>" + (L.stage === "conf" ? "Room " + L.roomNo : L.stage === "paid" ? "Advance paid, room not allotted" : "Held to " + when(L.holdUntil)) + "</span></li>"; }).join("") || "<li><span>No one yet.</span></li>") + "</ul></div>";
    }).join("") + "</div>";
    document.querySelectorAll("[data-rev]").forEach(function (b) { b.onclick = function () { ui.roomEv = +b.dataset.rev; render(); }; });
    document.querySelectorAll("[data-lead]").forEach(function (b) { b.onclick = function () { ui.lead = +b.dataset.lead; ui.view = "leads"; ui.stage = "all"; ui.ev = 0; render(); }; });
  }

  /* ---------- follow-ups ---------- */
  function vFollow() {
    var ls = visible().filter(due).sort(function (a, b) { return due(a) - due(b); });
    $("view").innerHTML = '<div class="fu">' + (ls.map(function (L) { var f = due(L), tp = L.stage === "hold" ? "holdnudge" : "nudge"; return '<div class="fu-r"><div><b>' + esc(L.name) + '</b> <span class="chip s-' + L.stage + '">' + SNAME[L.stage] + '</span> <span class="tag">' + esc(ev(L.ev).name) + '</span><p><span class="due' + (f > NOW ? " soon" : "") + '">' + (f < NOW ? "Overdue since " + when(f) : "Due " + when(f)) + "</span> · last message " + ago(last(L).at) + (last(L).dir === "in" ? " from the guest" : " from you") + '</p></div><div class="acts" style="margin:0"><button class="btn sm" data-fu="' + L.id + '" data-tp="' + tp + '">Send follow-up</button><button class="btn sm ghost" data-lead="' + L.id + '">Open</button></div></div>'; }).join("") || '<p class="empty">Nobody is waiting on you.</p>') + "</div>";
    document.querySelectorAll("[data-lead]").forEach(function (b) { b.onclick = function () { ui.lead = +b.dataset.lead; ui.view = "leads"; ui.stage = "all"; render(); }; });
    document.querySelectorAll("[data-fu]").forEach(function (b) { b.onclick = function () { var L = S.leads.filter(function (x) { return x.id === +b.dataset.fu; })[0], x = S.tpl.filter(function (q) { return q.id === b.dataset.tp; })[0]; L.thread.push({ dir: "out", at: Date.now(), subj: fill(x.subj, L), body: fill(x.body, L) }); L.follow = Date.now() + 3 * DAY; NOW = Date.now(); save(); toast("Follow-up added to " + L.name.split(" ")[0] + "’s conversation. Next reminder in 3 days."); render(); }; });
  }

  /* ---------- templates ---------- */
  function vTemplates() {
    var x = S.tpl.filter(function (q) { return q.id === ui.tpl; })[0] || S.tpl[0], sample = S.leads[0];
    $("view").innerHTML = '<div class="t-grid"><div class="t-list">' + cats().map(function (c) { return "<h5>" + esc(c) + "</h5>" + S.tpl.filter(function (q) { return q.cat === c; }).map(function (q) { return '<button data-tp="' + q.id + '"' + (q.id === x.id ? ' aria-current="true"' : "") + ">" + esc(q.name) + "</button>"; }).join(""); }).join("") + '</div><div class="t-edit"><label for="t-name">Name</label><input id="t-name" value="' + esc(x.name) + '"><label for="t-subj">Subject</label><input id="t-subj" value="' + esc(x.subj) + '"><label for="t-body">Message</label><textarea id="t-body">' + esc(x.body) + '</textarea><div class="vars">' + ["first", "event", "dates", "room", "nights", "total", "advance", "balance", "available", "holdUntil", "roomNo", "alternatives"].map(function (v) { return "<code>{{" + v + "}}</code>"; }).join("") + '</div><p style="font-size:12px;color:var(--ink3)">The words in double braces are filled in for each guest when you use the template: their name, programme, room, amounts and what is free at that moment.</p><div class="acts"><button class="btn" id="t-save">Save template</button></div><div class="sec" style="margin-top:16px"><h4>Preview for ' + esc(sample.name) + '</h4><div class="msg out" style="max-width:100%" id="t-prev"></div></div></div></div>';
    function prev() { $("t-prev").textContent = fill($("t-subj").value, sample) + "\n\n" + fill($("t-body").value, sample); } prev();
    $("t-subj").oninput = prev; $("t-body").oninput = prev;
    document.querySelectorAll("[data-tp]").forEach(function (b) { b.onclick = function () { ui.tpl = b.dataset.tp; render(); }; });
    $("t-save").onclick = function () { x.name = $("t-name").value.trim() || x.name; x.subj = $("t-subj").value; x.body = $("t-body").value; save(); toast("Template saved."); render(); };
  }

  /* ---------- wiring ---------- */
  document.querySelectorAll(".nav-b").forEach(function (b) { b.onclick = function () { ui.view = b.dataset.v; render(); }; });
  $("q").oninput = function () { ui.q = this.value; render(); this.focus(); };
  $("reset").onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} S = load(); ui.lead = 0; toast("Sample data restored."); render(); };
  render();
})();
</script>
