<title>Buddha Pāda Bookings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* layout: the shrine photograph fills the screen; one glass sheet floats over it. Everything that carries text sits on solid panels inside the sheet,
   so the photo shows only around the sheet and through its gutters. Sidebar at 1200 and up, an icon rail from 860, a bottom tab bar below that. */
:root {
  --ground: #d9cfc0; --scrim: rgba(250, 246, 240, .22); --sheet: rgba(255, 255, 255, .8); --panel: #ffffff; --panel-2: #faf7f2; --well: #f1ece4;
  --ink: #1b1915; --ink2: #5a544b; --ink3: #6b655c; --line: #e4ddd2; --accent: #8a1f24; --accent-soft: #f6e9e8; --gold: #b8892b;
  --ok: #256b41; --ok-soft: #e4f1e8; --warn: #8a5200; --warn-soft: #fbeed6; --bad: #a3261a; --bad-soft: #f9e4e1; --info: #2b5c8a; --info-soft: #e3edf6;
  --f-text: "Inter", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --tap: 36px; --pad: 24px; color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ground) url("bg.jpg") center 35% / cover fixed no-repeat; color: var(--ink); font: 14px/1.5 var(--f-text); box-sizing: border-box; padding-block: clamp(0px, 3vh, 32px); padding-left: max(clamp(0px, 2.6vw, 40px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(0px, 2.6vw, 40px), env(safe-area-inset-right, 0px)); }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--scrim); pointer-events: none; }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, select, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 16px; top: 16px; z-index: 50; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: #fff; }
.app { position: relative; height: 100%; max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 200px minmax(0, 1fr); border-radius: 24px; overflow: hidden; background: rgba(255, 255, 255, .94); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .8), 0 24px 70px rgba(40, 26, 10, .32); }
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) { .app { background: var(--sheet); -webkit-backdrop-filter: blur(28px) saturate(1.2); backdrop-filter: blur(28px) saturate(1.2); } }

/* navigation */
.side { display: flex; flex-direction: column; gap: 4px; padding: 20px 12px 14px; min-height: 0; }
.brand { padding: 0 8px 16px; } .brand b { display: block; font: 600 20px/1.2 var(--f-display); } .brand span { font-size: 12px; color: var(--ink3); }
.nav-b { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 10px; font-weight: 500; color: var(--ink2); } .nav-b:hover { background: rgba(255, 255, 255, .6); }
.nav-b svg { flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-b[aria-current="page"] { background: var(--ink); color: #fff; } .nav-b i { margin-left: auto; min-width: 22px; padding: 0 6px; border-radius: 99px; font: 600 12px/20px var(--f-text); font-style: normal; text-align: center; background: var(--accent); color: #fff; } .nav-b i:empty { display: none; }
.proto { margin-top: auto; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); font-size: 12px; line-height: 1.45; color: #5c3900; }

/* main column */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 12px var(--pad) 12px 8px; }
.top h1 { margin: 0; font: 600 24px/1.2 var(--f-display); } .top p { margin: 0; font-size: 12px; color: var(--ink2); } .top .sp { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 14px; border-radius: 10px; font-size: 14px; font-weight: 600; background: var(--ink); color: #fff; white-space: nowrap; }
.btn.sec { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); } .btn.quiet { background: none; color: var(--ink2); font-weight: 500; } .btn.quiet:hover { background: var(--well); } .btn.danger { background: var(--bad); } .btn:disabled { opacity: .45; cursor: default; } .btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.view { flex: 1; min-height: 0; padding: 0 var(--pad) var(--pad) 8px; overflow: hidden; }
.scroll { height: 100%; overflow-y: auto; border-radius: 14px; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 1px 9px; border-radius: 99px; font: 600 12px/1.4 var(--f-text); white-space: nowrap; background: var(--well); color: var(--ink2); } .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-new { background: var(--info-soft); color: var(--info); } .s-hold { background: var(--warn-soft); color: var(--warn); } .s-ended { background: var(--bad-soft); color: var(--bad); } .s-paid { background: #f5ead0; color: #6b4d0a; } .s-conf { background: var(--ok-soft); color: var(--ok); } .s-lost { background: var(--well); color: var(--ink3); }
.tag { font-size: 12px; color: var(--ink3); }

/* guests: filter bar, list, detail */
.split { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 12px; height: 100%; min-height: 0; }
.listp { display: flex; flex-direction: column; min-height: 0; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.fbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.fbar input, .fbar select, .field input, .field select, .field textarea { width: 100%; min-height: var(--tap); padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); } .fbar input { grid-column: 1 / -1; }
.fchips { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; } .fchips button { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--accent-soft); color: var(--accent); }
.rows { flex: 1; min-height: 0; overflow-y: auto; }
.row { display: block; width: 100%; padding: 12px 14px; border-bottom: 1px solid var(--line); } .row:hover { background: var(--panel-2); } .row:focus-visible { outline-offset: -2px; }
.row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row-h { display: flex; align-items: baseline; gap: 8px; } .row-h b { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row-h time { flex: none; font-size: 12px; color: var(--ink3); }
.row-m { display: flex; align-items: center; gap: 8px; margin-top: 4px; min-width: 0; } .row-m .tag { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row p { margin: 6px 0 0; font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row .note { display: block; margin-top: 6px; font-size: 12px; color: var(--warn); }
.empty { display: grid; place-content: center; justify-items: center; gap: 12px; height: 100%; padding: 32px; text-align: center; color: var(--ink2); }
.detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.d-head { position: relative; z-index: 3; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.d-head h2 { margin: 0; font: 600 18px/1.2 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .d-head p { margin: 2px 0 0; font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-back { display: none; flex: none; width: 44px; height: 44px; margin-left: -8px; border-radius: 10px; font-size: 24px; text-align: center; }
.d-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel-2); } .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: min(640px, 92%); padding: 10px 12px; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); white-space: pre-wrap; overflow-wrap: anywhere; } .msg.out { align-self: flex-end; background: #f4ece1; }
.msg header { display: flex; gap: 10px; justify-content: space-between; margin-bottom: 4px; font-size: 12px; color: var(--ink3); white-space: normal; } .msg header b { color: var(--ink2); font-weight: 600; }
button.msg { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--ink2); min-height: var(--tap); flex: none; } button.msg b { color: var(--ink); font-weight: 600; }
.dock { flex: none; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line); display: grid; gap: 8px; }
.dock-row { display: flex; gap: 8px; flex-wrap: wrap; } .dock-row .btn:first-child { flex: 1; justify-content: flex-start; font-weight: 500; color: var(--ink2); }
.strip { padding: 8px 12px; border-radius: 10px; font-size: 13px; background: var(--ok-soft); color: var(--ok); } .strip.low { background: var(--warn-soft); color: var(--warn); } .strip.full { background: var(--bad-soft); color: var(--bad); } .strip button { margin-left: 6px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; min-height: 28px; }
.dock textarea { width: 100%; min-height: 160px; max-height: 44vh; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); resize: vertical; line-height: 1.5; } .dock input[type="text"] { width: 100%; min-height: var(--tap); padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.dock-f { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .dock-f label { font-size: 13px; color: var(--ink2); } .dock-f select { min-height: var(--tap); padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); } .dock-f .sp { flex: 1; }
.err { padding: 8px 12px; border-radius: 10px; font-size: 13px; background: var(--bad-soft); color: var(--bad); }
.panel { min-height: 0; overflow-y: auto; padding: 16px; border-left: 1px solid var(--line); display: grid; gap: 12px; align-content: start; }
.card { border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 16px; } .card h3 { margin: 0 0 10px; font: 600 12px/1.4 var(--f-text); color: var(--ink2); }
.next { background: var(--panel-2); } .next .say { margin: 0; font: 600 18px/1.3 var(--f-display); } .next .sub { margin: 4px 0 0; font-size: 13px; color: var(--ink2); } .next .acts { display: grid; gap: 8px; margin-top: 14px; } .next .acts .btn { min-height: 44px; white-space: normal; text-align: center; }
.dots { display: flex; gap: 4px; margin: 0 0 14px; padding: 0; list-style: none; } .dots li { flex: 1; min-width: 0; font-size: 12px; color: var(--ink3); } .dots li::before { content: ""; display: block; height: 4px; margin-bottom: 6px; border-radius: 4px; background: var(--line); } .dots li.done { color: var(--ok); } .dots li.done::before { background: var(--ok); } .dots li.now { color: var(--ink); font-weight: 600; } .dots li.now::before { background: var(--accent); } .dots span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; margin-top: 12px; max-height: 168px; overflow-y: auto; padding: 2px; } .pick button { height: 44px; border-radius: 10px; font-weight: 600; text-align: center; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; } .pick button[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; } .mini .btn { grid-column: 1 / -1; min-height: 44px; }
.field { display: grid; gap: 4px; } .field > span { font-size: 12px; font-weight: 600; color: var(--ink2); } .field textarea { min-height: 72px; padding: 8px 10px; resize: vertical; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13px; } .kv dt { color: var(--ink3); } .kv dd { margin: 0; text-align: right; font-weight: 500; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.avail { display: grid; gap: 6px; font-size: 13px; } .avail div { display: flex; justify-content: space-between; gap: 10px; } .avail b { font-variant-numeric: tabular-nums; } .avail .zero b { color: var(--bad); } .avail .mine { font-weight: 600; }
.fold > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: var(--tap); font-weight: 600; cursor: pointer; } .fold > summary::-webkit-details-marker { display: none; } .fold > summary::after { content: "Show"; font-size: 12px; font-weight: 500; color: var(--ink3); } .fold[open] > summary::after { content: "Hide"; } .fold > div { display: grid; gap: 12px; padding-top: 8px; }
.menu { position: relative; } .menu-p { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 220px; padding: 6px; border-radius: 12px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 14px 34px rgba(40, 26, 10, .2); } .menu-p button { display: block; width: 100%; min-height: 40px; padding: 0 12px; border-radius: 8px; } .menu-p button:hover { background: var(--well); } .menu-p .bad { color: var(--bad); }

/* today */
.today { display: grid; gap: 20px; max-width: 880px; padding-bottom: 8px; } .grp h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; font: 600 18px/1.3 var(--f-display); } .grp h2 small { font: 500 13px var(--f-text); color: var(--ink3); }
.grp-b { border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); overflow: hidden; } .t-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); } .t-row:last-child { border-bottom: 0; } .t-row b { font-weight: 600; } .t-row p { margin: 2px 0 0; font-size: 13px; color: var(--ink2); } .t-row .why { color: var(--warn); font-weight: 500; } .t-row .why.bad { color: var(--bad); }

/* rooms */
.rbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; } .rbar select { min-height: var(--tap); padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); max-width: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); } .legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 14px; height: 14px; border-radius: 4px; }
.k-free { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); } .k-hold { background: repeating-linear-gradient(135deg, #f3d9a4 0 5px, #fbeed6 5px 10px); color: var(--warn); } .k-paid { background: var(--gold); color: #fff; } .k-conf { background: var(--ok); color: #fff; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; } .rm h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0; font: 600 18px/1.3 var(--f-display); color: var(--ink); } .rm h3 small { font: 500 13px var(--f-text); color: var(--ink2); } .rm h3 small.full { color: var(--bad); font-weight: 600; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; margin-top: 12px; } .cell { height: 48px; padding: 0 2px; border-radius: 10px; display: grid; place-content: center; text-align: center; font: 600 13px/1.15 var(--f-text); font-variant-numeric: tabular-nums; } .cell small { display: block; max-width: 52px; font-size: 10px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } span.cell.k-free { color: var(--ink3); }
.occ { margin: 12px 0 0; padding: 0; list-style: none; font-size: 13px; } .occ li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); } .occ li span { color: var(--ink3); text-align: right; }

/* replies */
.t-grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 12px; height: 100%; min-height: 0; } .t-list { min-height: 0; overflow-y: auto; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 8px; }
.t-list h4 { margin: 12px 10px 4px; font: 600 12px/1.4 var(--f-text); color: var(--ink3); } .t-list button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 4px 10px; border-radius: 8px; color: var(--ink2); } .t-list button:hover { background: var(--well); } .t-list button[aria-current="true"] { background: var(--ink); color: #fff; } .t-list .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.t-edit { min-height: 0; overflow-y: auto; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 16px; display: grid; gap: 12px; align-content: start; } .t-edit textarea { min-height: 280px; line-height: 1.55; } .ins { display: flex; gap: 6px; flex-wrap: wrap; } .ins button { min-height: 30px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--well); color: var(--ink2); }
.prev { padding: 12px; border-radius: 12px; background: #f4ece1; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }

/* undo bar, dialog, picker */
.undo { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); min-height: 48px; padding: 6px 8px 6px 16px; border-radius: 12px; background: var(--ink); color: #fff; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); } .undo span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .undo button { min-height: 36px; padding: 0 12px; border-radius: 8px; font-weight: 600; background: rgba(255, 255, 255, .16); }
.veil { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; padding: 16px; background: rgba(27, 25, 21, .4); }
.dlg { width: min(100%, 440px); max-height: 100%; overflow-y: auto; border-radius: 16px; background: var(--panel); padding: 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, .3); display: grid; gap: 12px; } .dlg h2 { margin: 0; font: 600 18px/1.3 var(--f-display); } .dlg p { margin: 0; color: var(--ink2); } .dlg-b { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; } .dlg-b .btn { min-height: 44px; }
.dlg.wide { width: min(100%, 520px); } .pk-list { display: grid; gap: 2px; max-height: 50vh; overflow-y: auto; } .pk-list h4 { margin: 10px 4px 2px; font: 600 12px/1.4 var(--f-text); color: var(--ink3); } .pk-list button { min-height: 44px; padding: 4px 10px; border-radius: 8px; } .pk-list button:hover { background: var(--well); } .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* icon rail */
@media (max-width: 1199px) {
  .app { grid-template-columns: 72px minmax(0, 1fr); } .brand, .proto { display: none; } .side { padding: 14px 6px; align-items: stretch; }
  .nav-b { position: relative; flex-direction: column; justify-content: center; gap: 2px; min-height: 56px; padding: 6px 2px; font-size: 11px; text-align: center; } .nav-b i { position: absolute; top: 4px; right: 8px; margin: 0; min-width: 18px; padding: 0 4px; font-size: 11px; line-height: 18px; }
  .split { grid-template-columns: 300px minmax(0, 1fr); }
  .d-grid { display: block; overflow-y: auto; } .panel { border-left: 0; border-bottom: 1px solid var(--line); overflow: visible; } .conv { min-height: 0; } .thread { overflow: visible; } .dock { position: sticky; bottom: 0; z-index: 2; }
}
/* phone: bottom tabs, list and guest as separate full screens */
@media (max-width: 859px) {
  :root { --tap: 44px; --pad: 16px; } body { padding: 0; font-size: 15px; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; border-radius: 0; max-width: none; }
  .side { order: 2; flex-direction: row; gap: 0; padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); background: var(--panel); border-top: 1px solid var(--line); } .nav-b { flex: 1; min-height: 56px; border-radius: 0; } .nav-b[aria-current="page"] { background: none; color: var(--accent); } .nav-b i { right: calc(50% - 26px); }
  .top { min-height: 52px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); } .top h1 { font-size: 20px; } .top p { display: none; } #undo-b span { display: none; }
  .view { padding: 0 max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px)); }
