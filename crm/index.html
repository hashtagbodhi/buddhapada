<title>Buddha Pāda Bookings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================================================================
   THE RULES. Everything below is built from these and nothing else.
   Type      five styles: title, large, headline, body, caption. Two weights for text (400, 600); 700 for the title only.
   Colour    one ink in three strengths (label, secondary, tertiary); one accent (blue) for the main action, selection and
             links; green, orange and red only to report a state, shown as a small dot beside plain words.
   Space     a 4-point grid: 4, 8, 12, 16, 20, 24. Rows are padded 12 by 16.
   Shape     window 12, groups 10, controls 6 (10 on touch). Hairlines are half a pixel. No decorative shadows.
   Material  the sidebar is translucent and lets the photograph through; content is solid white; panels float only when
             they are temporary (menus, dialogs, the undo bar).
   Layout    one window of flush columns divided by hairlines, as in Mail: sidebar, list, conversation, inspector.
   Controls  28 high with a pointer, 44 on touch. One filled button per view; the rest are quiet grey.
   ===================================================================================================================== */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Inter", "Segoe UI", Roboto, sans-serif;
  --t-title: 700 15px/20px var(--font); --t-large: 600 17px/22px var(--font); --t-head: 600 13px/18px var(--font); --t-body: 400 13px/18px var(--font); --t-cap: 400 11px/14px var(--font);
  --label: #1d1d1f; --label-2: #6e6e73; --label-3: #a1a1a6; --sep: rgba(60, 60, 67, .2); --fill: rgba(116, 116, 128, .12); --fill-2: rgba(116, 116, 128, .08);
  --bg: #ffffff; --bg-2: #f5f5f7; --accent: #0071e3; --accent-ink: #0066cc; --on-accent: #ffffff;
  --green: #248a3d; --orange: #b25000; --red: #d70015; --yellow: #a67c00; --grey: #8e8e93;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
  --r-win: 12px; --r-group: 10px; --r-ctl: 6px; --ctl: 28px; --ctl-lg: 32px; --hair: .5px;
  --ground: #cbb48f; color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground) url("bg.jpg") center 35% / cover fixed no-repeat; color: var(--label); font: var(--t-body); -webkit-font-smoothing: antialiased; padding-block: clamp(0px, 3.4vh, 36px); padding-left: max(clamp(0px, 3vw, 48px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(0px, 3vw, 48px), env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, select, textarea { font: inherit; color: var(--label); }
:focus-visible { outline: 3px solid rgba(0, 113, 227, .5); outline-offset: 1px; }
.skip { position: absolute; left: -999px; } .skip:focus { left: var(--s4); top: var(--s4); z-index: 50; padding: var(--s2) var(--s3); border-radius: var(--r-ctl); background: var(--label); color: var(--on-accent); }

/* window */
.app { position: relative; height: 100%; max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 1fr); border-radius: var(--r-win); overflow: hidden; background: rgba(246, 246, 248, .96); box-shadow: 0 0 0 var(--hair) rgba(0, 0, 0, .3), 0 36px 90px rgba(0, 0, 0, .42); }
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) { .app { background: rgba(246, 246, 248, .72); -webkit-backdrop-filter: blur(50px) saturate(1.8); backdrop-filter: blur(50px) saturate(1.8); } }

/* sidebar */
.side { display: flex; flex-direction: column; gap: 1px; padding: var(--s5) var(--s3) var(--s3); min-height: 0; border-right: var(--hair) solid var(--sep); }
.brand { padding: 0 var(--s2) var(--s4); } .brand b { display: block; font: var(--t-head); } .brand span { font: var(--t-cap); color: var(--label-2); }
.nav-b { display: flex; align-items: center; gap: var(--s2); min-height: var(--ctl); padding: 0 var(--s2); border-radius: var(--r-ctl); font: var(--t-body); }
.nav-b svg { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-b:hover { background: var(--fill-2); } .nav-b[aria-current="page"] { background: var(--fill); font-weight: 600; }
.nav-b i { margin-left: auto; font: var(--t-cap); font-style: normal; color: var(--label-2); font-variant-numeric: tabular-nums; } .nav-b i:empty { display: none; }
.proto { margin-top: auto; padding: var(--s2); font: var(--t-cap); color: var(--label-2); } .proto b { font-weight: 600; color: var(--label); }

/* content column and toolbar */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.top { display: flex; align-items: center; gap: var(--s2); min-height: 52px; padding: 0 var(--s4); border-bottom: var(--hair) solid var(--sep); }
.top h1 { margin: 0; font: var(--t-title); } .top p { margin: 0; font: var(--t-cap); color: var(--label-2); } .top .sp { flex: 1; }
.view { flex: 1; min-height: 0; overflow: hidden; } .scroll { height: 100%; overflow-y: auto; padding: var(--s5) var(--s6) var(--s6); } .view.free .scroll { background: var(--bg-2); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); min-height: var(--ctl); padding: 0 var(--s3); border-radius: var(--r-ctl); font: var(--t-body); font-weight: 600; background: var(--accent); color: var(--on-accent); white-space: nowrap; } .btn:active { filter: brightness(.9); }
.btn.sec { background: var(--fill); color: var(--label); font-weight: 400; } .btn.quiet { background: none; color: var(--accent-ink); font-weight: 400; } .btn.quiet:hover { background: var(--fill-2); } .btn.danger { background: var(--red); } .btn:disabled { opacity: .4; cursor: default; } .btn.block { width: 100%; }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fbar input, .fbar select, .field input, .field select, .field textarea, .dock textarea, .dock input[type="text"], .dock-f select, .rbar select { width: 100%; min-height: var(--ctl); padding: 0 var(--s2); border-radius: var(--r-ctl); border: var(--hair) solid rgba(0, 0, 0, .22); background: var(--bg); box-shadow: inset 0 var(--hair) 1px rgba(0, 0, 0, .06); }
.fbar input[type="search"] { border-color: transparent; background: var(--fill); box-shadow: none; padding: 0 var(--s3); }
.field { display: grid; gap: var(--s1); } .field > span { font: var(--t-cap); color: var(--label-2); } .field textarea { min-height: 72px; padding: var(--s2); resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }

/* status: a small dot and plain words */
.chip { display: inline-flex; align-items: center; gap: 5px; font: var(--t-cap); color: var(--label-2); white-space: nowrap; } .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--grey); }
.s-new::before { background: var(--accent); } .s-hold::before { background: #ff9500; } .s-ended::before { background: #ff3b30; } .s-paid::before { background: #ffcc00; } .s-conf::before { background: #34c759; } .s-ended { color: var(--red); }
.tag { font: var(--t-cap); color: var(--label-2); }

/* guests: list column and guest column, flush, divided by hairlines */
.split { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; min-height: 0; }
.listp { display: flex; flex-direction: column; min-height: 0; border-right: var(--hair) solid var(--sep); }
.fbar { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); padding: var(--s3); border-bottom: var(--hair) solid var(--sep); } .fbar input { grid-column: 1 / -1; }
.fchips { grid-column: 1 / -1; display: flex; gap: var(--s1); flex-wrap: wrap; } .fchips button { min-height: 22px; padding: 0 var(--s2); border-radius: var(--r-ctl); font: var(--t-cap); background: var(--fill); }
.rows { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s1) var(--s2); }
.row { position: relative; display: block; width: 100%; padding: var(--s2) var(--s3); border-radius: var(--r-ctl); } .row + .row::before { content: ""; position: absolute; left: var(--s3); right: var(--s3); top: 0; height: var(--hair); background: var(--sep); }
.row:hover { background: var(--fill-2); } .row:focus-visible { outline-offset: -3px; }
.row-h { display: flex; align-items: baseline; gap: var(--s2); } .row-h b { flex: 1; min-width: 0; font: var(--t-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row-h time { flex: none; font: var(--t-cap); color: var(--label-2); }
.row-m { display: flex; align-items: center; gap: var(--s2); margin-top: 2px; min-width: 0; } .row-m .tag { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row p { margin: 2px 0 0; color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row .note { display: block; margin-top: 2px; font: var(--t-cap); color: var(--orange); }
.row[aria-current="true"] { background: var(--accent); color: var(--on-accent); } .row[aria-current="true"]::before, .row[aria-current="true"] + .row::before { display: none; }
.row[aria-current="true"] time, .row[aria-current="true"] .tag, .row[aria-current="true"] p, .row[aria-current="true"] .note, .row[aria-current="true"] .chip { color: rgba(255, 255, 255, .86); } .row[aria-current="true"] .chip::before { background: var(--on-accent); }
.empty { display: grid; place-content: center; justify-items: center; gap: var(--s3); height: 100%; padding: var(--s6); text-align: center; color: var(--label-2); }

.detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.d-head { position: relative; z-index: 3; display: flex; align-items: center; gap: var(--s3); min-height: 52px; padding: var(--s2) var(--s4); border-bottom: var(--hair) solid var(--sep); background: var(--bg); }
.d-head h2 { margin: 0; font: var(--t-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .d-head p { margin: 0; font: var(--t-cap); color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-back { display: none; flex: none; width: 44px; height: 44px; margin-left: -12px; font-size: 28px; line-height: 1; text-align: center; color: var(--accent); }
.d-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; } .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--s4); display: flex; flex-direction: column; }
/* the conversation reads like Mail: flat messages, a hairline between them, our own replies marked by a blue name */
.msg { position: relative; padding: var(--s3) 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 680px; } .msg + .msg { border-top: var(--hair) solid var(--sep); }
.msg header { display: flex; gap: var(--s3); justify-content: space-between; align-items: baseline; margin-bottom: var(--s1); font: var(--t-cap); color: var(--label-2); white-space: normal; } .msg header b { font: var(--t-head); color: var(--label); } .msg.out header b { color: var(--accent-ink); }
button.msg { display: block; width: 100%; flex: none; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--label-2); min-height: var(--ctl-lg); padding: var(--s2) 0; } button.msg b { font-weight: 600; color: var(--label); } button.msg.out b { color: var(--accent-ink); } button.msg:hover { color: var(--label); }
.dock { flex: none; padding: var(--s3) var(--s4); border-top: var(--hair) solid var(--sep); background: var(--bg); display: grid; gap: var(--s2); }
.dock-row { display: flex; gap: var(--s2); flex-wrap: wrap; } .dock-row .btn:first-child { flex: 1; justify-content: flex-start; color: var(--label-2); border-radius: 99px; padding: 0 var(--s3); }
.strip { padding: var(--s2) var(--s3); border-radius: var(--r-ctl); background: var(--fill-2); color: var(--label-2); } .strip::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #34c759; } .strip.low::before { background: #ff9500; } .strip.full::before { background: #ff3b30; } .strip.full { color: var(--red); } .strip button { margin-left: var(--s1); color: var(--accent-ink); min-height: 22px; }
.dock textarea { min-height: 150px; max-height: 44vh; padding: var(--s2); resize: vertical; line-height: 18px; }
.dock-f { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; } .dock-f label { color: var(--label-2); } .dock-f select { width: auto; } .dock-f .sp { flex: 1; }
.err { padding: var(--s2) var(--s3); border-radius: var(--r-ctl); background: rgba(215, 0, 21, .08); color: var(--red); }

/* inspector: plain sections divided by hairlines, the next step first */
.panel { min-height: 0; overflow-y: auto; border-left: var(--hair) solid var(--sep); background: var(--bg-2); }
.card { padding: var(--s4); border-bottom: var(--hair) solid var(--sep); } .card h3 { margin: 0 0 var(--s2); font: var(--t-cap); font-weight: 600; color: var(--label-2); }
.next { background: var(--bg); } .next .say { margin: 0; font: var(--t-large); letter-spacing: -.01em; } .next .sub { margin: var(--s1) 0 0; color: var(--label-2); } .next .acts { display: grid; gap: var(--s2); margin-top: var(--s3); } .next .acts .btn { min-height: var(--ctl-lg); white-space: normal; text-align: center; }
.dots { display: flex; gap: 3px; margin: 0 0 var(--s3); padding: 0; list-style: none; } .dots li { flex: 1; min-width: 0; font: var(--t-cap); color: var(--label-3); } .dots li::before { content: ""; display: block; height: 3px; margin-bottom: var(--s1); border-radius: 3px; background: var(--fill); } .dots li.done { color: var(--label-2); } .dots li.done::before { background: var(--accent); opacity: .45; } .dots li.now { color: var(--label); font-weight: 600; } .dots li.now::before { background: var(--accent); } .dots span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: var(--s1); margin-top: var(--s3); max-height: 160px; overflow-y: auto; padding: 2px; } .pick button { height: var(--ctl-lg); border-radius: var(--r-ctl); text-align: center; background: var(--fill); font-variant-numeric: tabular-nums; } .pick button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-top: var(--s3); } .mini .btn { grid-column: 1 / -1; min-height: var(--ctl-lg); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s1) var(--s3); margin: 0; } .kv dt { color: var(--label-2); } .kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.avail { display: grid; gap: var(--s1); } .avail div { display: flex; justify-content: space-between; gap: var(--s3); color: var(--label-2); } .avail b { font-weight: 400; font-variant-numeric: tabular-nums; } .avail .zero b { color: var(--red); } .avail .mine { color: var(--label); font-weight: 600; } .avail .mine b { font-weight: 600; }
.fold > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: var(--ctl); font: var(--t-head); cursor: pointer; } .fold > summary::-webkit-details-marker { display: none; } .fold > summary::after { content: "Show"; font: var(--t-body); color: var(--accent-ink); } .fold[open] > summary::after { content: "Hide"; } .fold > div { margin: var(--s2) calc(var(--s4) * -1) calc(var(--s4) * -1); border-top: var(--hair) solid var(--sep); } .fold .card:last-child { border-bottom: 0; }

/* temporary surfaces */
.menu { position: relative; } .menu-p { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 210px; padding: var(--s1); border-radius: var(--r-group); background: rgba(246, 246, 248, .86); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8); box-shadow: 0 0 0 var(--hair) rgba(0, 0, 0, .22), 0 10px 30px rgba(0, 0, 0, .2); }
.menu-p button { display: block; width: 100%; min-height: 24px; padding: 2px var(--s2); border-radius: 4px; } .menu-p button:hover { background: var(--accent); color: var(--on-accent); } .menu-p .bad { color: var(--red); } .menu-p .bad:hover { color: var(--on-accent); }
.undo { position: absolute; left: 50%; top: var(--s3); transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: var(--s3); max-width: calc(100% - 32px); min-height: 36px; padding: var(--s1) var(--s1) var(--s1) var(--s4); border-radius: 99px; background: rgba(40, 40, 42, .82); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); color: #fff; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); } .undo span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .undo button { min-height: var(--ctl); padding: 0 var(--s3); border-radius: 99px; font-weight: 600; color: #64b5ff; }
.veil { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; padding: var(--s4); background: rgba(0, 0, 0, .22); }
.dlg { width: min(100%, 420px); max-height: 100%; overflow-y: auto; border-radius: var(--r-win); padding: var(--s5); background: rgba(246, 246, 248, .94); -webkit-backdrop-filter: blur(40px) saturate(1.8); backdrop-filter: blur(40px) saturate(1.8); box-shadow: 0 0 0 var(--hair) rgba(0, 0, 0, .25), 0 30px 80px rgba(0, 0, 0, .35); display: grid; gap: var(--s3); } .dlg.wide { width: min(100%, 480px); }
.dlg h2 { margin: 0; font: var(--t-head); } .dlg p { margin: 0; color: var(--label-2); } .dlg-b { display: flex; gap: var(--s2); justify-content: flex-end; flex-wrap: wrap; margin-top: var(--s1); } .dlg-b .btn { min-width: 84px; }
.pk-list { display: grid; gap: 1px; max-height: 50vh; overflow-y: auto; } .pk-list h4, .t-list h4 { margin: var(--s3) var(--s2) var(--s1); font: var(--t-cap); font-weight: 600; color: var(--label-2); } .pk-list button { min-height: var(--ctl); padding: 0 var(--s2); border-radius: var(--r-ctl); } .pk-list button:hover { background: var(--accent); color: var(--on-accent); }

/* today, rooms, replies: grouped lists on the grey ground, as in System Settings */
.today { display: grid; gap: var(--s6); max-width: 760px; } .grp h2 { display: flex; align-items: baseline; gap: var(--s2); margin: 0 var(--s4) var(--s2); font: var(--t-head); } .grp h2 small { font: var(--t-cap); color: var(--label-2); }
.grp-b, .rm, .t-list, .t-edit { border-radius: var(--r-group); background: var(--bg); box-shadow: 0 0 0 var(--hair) var(--sep); }
.t-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); } .t-row + .t-row::before { content: ""; position: absolute; left: var(--s4); right: 0; top: 0; height: var(--hair); background: var(--sep); }
.t-row b { font: var(--t-head); margin-right: var(--s2); } .t-row p { margin: 2px 0 0; color: var(--label-2); } .t-row .why { color: var(--label); } .t-row .why.bad { color: var(--red); }
.rbar { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s4); } .rbar select { width: auto; max-width: 100%; }
.legend { display: flex; gap: var(--s4); flex-wrap: wrap; font: var(--t-cap); color: var(--label-2); } .legend span { display: inline-flex; align-items: center; gap: 5px; } .legend i { width: 10px; height: 10px; border-radius: 3px; }
.k-free { background: var(--fill-2); color: var(--label-3); } .k-hold { background: rgba(255, 149, 0, .2); color: var(--orange); } .k-paid { background: rgba(255, 204, 0, .32); color: #6b5200; } .k-conf { background: rgba(52, 199, 89, .22); color: var(--green); }
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--s4); } .rm { padding: var(--s4); border-bottom: 0; } .rm h3 { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); flex-wrap: wrap; margin: 0; font: var(--t-head); color: var(--label); } .rm h3 small { font: var(--t-cap); color: var(--label-2); } .rm h3 small.full { color: var(--red); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: var(--s1); margin-top: var(--s3); } .cell { height: 40px; padding: 0 2px; border-radius: var(--r-ctl); display: grid; place-content: center; text-align: center; font: var(--t-cap); font-weight: 600; font-variant-numeric: tabular-nums; } .cell small { display: block; max-width: 48px; font: 400 10px/12px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.occ { margin: var(--s3) 0 0; padding: 0; list-style: none; } .occ li { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s1) 0; border-top: var(--hair) solid var(--sep); } .occ li span { color: var(--label-2); text-align: right; }
